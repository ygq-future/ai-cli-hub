<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111817" />
    <link rel="icon" href="/webui/assets/icon.svg?v=5" type="image/svg+xml" sizes="any" />
    <link rel="shortcut icon" href="/webui/assets/icon.svg?v=5" type="image/svg+xml" />
    <title>AI CLI Hub</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
      }
      #root,
      .login {
        min-height: 100dvh;
      }
      .login {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .login > section {
        width: min(100%, 510px);
        padding: clamp(27px, 7vw, 52px);
        border: 1px solid transparent;
        border-radius: 28px;
        box-sizing: border-box;
      }
      .login h1 {
        display: grid;
        gap: 0.16em;
        margin: 31px 0 17px;
        font-size: clamp(2.45rem, 9vw, 4.2rem);
        line-height: 1.03;
        letter-spacing: -0.055em;
      }
      .login-title-line {
        display: block;
      }
      @media (max-width: 760px) {
        .login {
          align-items: start;
          padding: 15px;
        }
        .login > section {
          margin-top: max(25px, 8dvh);
          padding: 30px 24px;
          border-radius: 23px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
